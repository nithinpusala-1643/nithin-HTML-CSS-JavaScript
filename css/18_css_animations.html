<title>18 - Keyframe Animations</title>
<style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #0f172a; }
        .pulse-circle { width: 100px; height: 100px; background: #38bdf8; border-radius: 50%; animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(56, 189, 248, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }
    </style>
