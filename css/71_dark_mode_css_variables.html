<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>71 - Dark Mode Theme</title>
<style>
        :root { --bg: #ffffff; --text: #000000; }
        [data-theme="dark"] { --bg: #121212; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 40px; transition: 0.3s; }
    </style>
<link href="../assets/style.css" rel="stylesheet"/></head>
<body><nav class="site-nav"><a class="brand" href="../index.html">WTIP Practical Programs</a><div class="links"><a href="../index.html">Home</a><a href="index.html">Css Programs</a></div></nav>
<h2>CSS Variables Dark Mode</h2>
<button onclick="document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')">Toggle Theme</button>

</html>
