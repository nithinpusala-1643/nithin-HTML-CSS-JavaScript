<meta charset="utf-8"/>
<title>23 - Product Card Layout</title>
<style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f5f5f5; font-family: sans-serif; }
        .product-card { background: white; width: 280px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .product-img { width: 100%; height: 200px; background: #ddd; display: flex; align-items: center; justify-content: center; color: #777; }
        .product-info { padding: 20px; }
        .price { font-size: 1.2rem; color: #e74c3c; font-weight: bold; }
        .btn-add { display: block; width: 100%; padding: 10px; background: #2ecc71; color: white; text-align: center; border: none; border-radius: 6px; margin-top: 10px; cursor: pointer; }
    </style>
<link href="../assets/style.css" rel="stylesheet"/></head>
