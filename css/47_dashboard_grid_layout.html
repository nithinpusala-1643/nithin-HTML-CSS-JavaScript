<title>47 - CSS Grid Dashboard</title>
<style>
        body { font-family: sans-serif; margin: 0; }
        .dashboard { display: grid; grid-template-columns: 200px 1fr; height: 100vh; }
        .sidebar { background: #2c3e50; color: white; padding: 20px; }
        .main-content { background: #ecf0f1; padding: 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; height: max-content; }
        .widget { background: white; padding: 20px; border-radius: 8px; }
    </style>
